name: Euphoria

on:
  push:
    paths:
      - 'packages/euphoria/**'
      - 'sandbox/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/euphoria.yml'
  pull_request:
    paths:
      - 'packages/euphoria/**'
      - 'sandbox/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/euphoria.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  euphoria:
    name: Euphoria checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @dotm4x/euphoria test

      - name: Type-check
        run: pnpm --filter @dotm4x/euphoria typecheck

      - name: Build
        run: pnpm --filter @dotm4x/euphoria build

      - name: Install GPU test browser
        run: pnpm --filter @euphoria/sandbox exec playwright install --with-deps chromium

      - name: GPU tests
        run: pnpm --filter @euphoria/sandbox test:gpu
