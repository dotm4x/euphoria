name: Engine

on:
  push:
    paths:
      - 'packages/engine/**'
      - 'apps/playground/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/engine.yml'
  pull_request:
    paths:
      - 'packages/engine/**'
      - 'apps/playground/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Engine checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @euphoria/engine test

      - name: Type-check
        run: pnpm --filter @euphoria/engine typecheck

      - name: Build
        run: pnpm --filter @euphoria/engine build

      - name: Install GPU test browser
        run: pnpm --filter @euphoria/playground exec playwright install --with-deps chromium

      - name: GPU tests
        run: pnpm --filter @euphoria/playground test:gpu
